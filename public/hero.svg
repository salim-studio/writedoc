<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="writedoc — a fast, private word processor with real .docx files in your own cloud">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efefff"/>
      <stop offset="1" stop-color="#fafaff"/>
    </linearGradient>
    <linearGradient id="hero-lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d63f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" rx="0" fill="url(#hero-bg)"/>
  <circle cx="1090" cy="80" r="150" fill="#4f46e5" opacity="0.08"/>
  <circle cx="110" cy="570" r="130" fill="#4338ca" opacity="0.08"/>
  <circle cx="620" cy="540" r="10" fill="#4f46e5" opacity="0.25"/>
  <circle cx="660" cy="540" r="10" fill="#4f46e5" opacity="0.15"/>
  <circle cx="60" cy="80" r="8" fill="#4f46e5" opacity="0.25"/>

  <!-- Logo + wordmark -->
  <g transform="translate(80,108) scale(2.0625)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#hero-lg)"/>
    <path d="M17.3 22.4 L25.3 43.5 L32 30.7 L38.7 43.5 L46.7 22.4" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="232" y="200" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="72" font-weight="800" fill="#191740">writedoc</text>
  <text x="84" y="292" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" fill="#4c4a68">A fast, private word processor in the browser,</text>
  <text x="84" y="330" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="27" fill="#4c4a68">with real .docx files in your own cloud.</text>

  <!-- Feature chips -->
  <g font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="21" fill="#4338ca" text-anchor="middle">
    <rect x="84" y="366" width="76" height="42" rx="21" fill="#ffffff" stroke="#d9d7f5" stroke-width="2"/>
    <text x="122" y="394">MIT</text>
    <rect x="174" y="366" width="104" height="42" rx="21" fill="#ffffff" stroke="#d9d7f5" stroke-width="2"/>
    <text x="226" y="394">.docx</text>
    <rect x="292" y="366" width="176" height="42" rx="21" fill="#ffffff" stroke="#d9d7f5" stroke-width="2"/>
    <text x="380" y="394">Canvas editor</text>
  </g>

  <!-- Editor mockup -->
  <ellipse cx="910" cy="572" rx="200" ry="14" fill="#4338ca" opacity="0.10"/>
  <rect x="700" y="70" width="420" height="486" rx="26" fill="#ffffff" stroke="#e2e0f7" stroke-width="2"/>
  <circle cx="738" cy="112" r="8" fill="#f87171"/>
  <circle cx="762" cy="112" r="8" fill="#fbbf24"/>
  <circle cx="786" cy="112" r="8" fill="#34d399"/>
  <rect x="812" y="98" width="240" height="28" rx="14" fill="#f1f0fd"/>
  <text x="932" y="118" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" font-size="18" fill="#6d6b8c" text-anchor="middle">writedoc</text>
  <rect x="730" y="148" width="64" height="30" rx="8" fill="#4f46e5"/>
  <rect x="804" y="148" width="44" height="30" rx="8" fill="#eef0fd"/>
  <rect x="858" y="148" width="44" height="30" rx="8" fill="#eef0fd"/>
  <rect x="912" y="148" width="44" height="30" rx="8" fill="#eef0fd"/>
  <rect x="966" y="148" width="44" height="30" rx="8" fill="#eef0fd"/>
  <rect x="730" y="200" width="360" height="326" rx="10" fill="#fffef8" stroke="#ece9dc" stroke-width="2"/>
  <rect x="754" y="224" width="180" height="22" rx="6" fill="#312e81"/>
  <rect x="754" y="262" width="312" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="286" width="280" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="310" width="300" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="334" width="150" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="910" y="330" width="4" height="22" fill="#4f46e5"/>
  <rect x="754" y="358" width="312" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="382" width="240" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="406" width="300" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="430" width="200" height="12" rx="6" fill="#d8d5e8"/>
  <rect x="754" y="458" width="312" height="12" rx="6" fill="#e6e2f5"/>
  <rect x="754" y="482" width="260" height="12" rx="6" fill="#e6e2f5"/>
  <!-- Comment chip -->
  <rect x="918" y="392" width="148" height="58" rx="12" fill="#eef0fd" stroke="#c9cdf5" stroke-width="2"/>
  <rect x="932" y="406" width="100" height="10" rx="5" fill="#a5b4fc"/>
  <rect x="932" y="424" width="120" height="10" rx="5" fill="#c9cdf5"/>
</svg>
