<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Browser Extension & Environment Compatibility:
      // Some Chrome extensions (ad blockers, request loggers, translation tools) attempt to intercept
      // network traffic by assigning `window.fetch = ...`. In environments where window.fetch has only
      // a getter or is non-writable on the prototype, this throws "Cannot set property fetch of #<Window> which has only a getter".
      // We provide a writable accessor on window and Window.prototype to allow interceptors to work cleanly.
      (() => {
        try {
          let _currentFetch = window.fetch;
          const defineFetch = (obj) => {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
                get() {
                  return _currentFetch;
                },
                set(fn) {
                  _currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            } catch {}
          };
          defineFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetch(Window.prototype);
          }
        } catch {}

        // Safe Storage polyfill: In iframes with partitioned cookies, sandboxed environments,
        // or private browsing modes, accessing window.localStorage or window.sessionStorage
        // throws "SecurityError: Access is denied for this document".
        // Polyfill them with an in-memory storage fallback so the application works seamlessly.
        const createMemoryStorage = () => {
          let store = {};
          return {
            getItem: (k) => (Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null),
            setItem: (k, v) => { store[k] = String(v); },
            removeItem: (k) => { delete store[k]; },
            clear: () => { store = {}; },
            key: (i) => Object.keys(store)[i] ?? null,
            get length() { return Object.keys(store).length; }
          };
        };

        const polyfillStorage = (prop) => {
          let accessible = false;
          try {
            const s = window[prop];
            if (s) {
              s.getItem('__test__');
              accessible = true;
            }
          } catch {}

          if (!accessible) {
            const mem = createMemoryStorage();
            try {
              Object.defineProperty(window, prop, {
                get() { return mem; },
                set() {},
                configurable: true,
                enumerable: true
              });
            } catch {}
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, prop, {
                  get() { return mem; },
                  set() {},
                  configurable: true,
                  enumerable: true
                });
              }
            } catch {}
          }
        };

        polyfillStorage('localStorage');
        polyfillStorage('sessionStorage');

        // Prevent external extension errors from breaking application lifecycle
        window.addEventListener('error', (event) => {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && event.message.includes('fetch of #<Window> which has only a getter'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          const reasonStr = String(event.reason?.stack || event.reason?.message || event.reason || '');
          if (
            reasonStr.includes('chrome-extension://') ||
            reasonStr.includes('fetch of #<Window> which has only a getter')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>WriteDoc - Word Processor &amp; DOCX Editor</title>
    <meta name="description" content="A fast, private, and powerful word processor. Create, edit, and format real .docx documents directly in your browser." />
    <meta name="author" content="salim-slimani" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="writedoc" />
    <meta property="og:title" content="WriteDoc - Word Processor &amp; DOCX Editor" />
    <meta property="og:description" content="A fast, private, and powerful word processor. Create, edit, and format real .docx documents directly in your browser." />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (() => {
        try {
          const t = localStorage.getItem('writedoc:theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          if (localStorage.getItem('writedoc:dark-page') === '1') document.documentElement.dataset.page = 'dark';
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <!-- Glass fills for the command icons (src/styles/command-icons.css): top-lit gradients whose stops are the
         --ico-* tokens, so every theme retints them. Not display:none, which would disable the gradients. -->
    <svg class="ico-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
      <defs>
        <linearGradient id="ico-g-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0.25" style="stop-color:var(--ico-paper-top)"/><stop offset="1" style="stop-color:var(--ico-paper)"/></linearGradient>
        <linearGradient id="ico-g-blue-soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-glass-rim)"/><stop offset="0.3" style="stop-color:var(--ico-blue-soft-top)"/><stop offset="1" style="stop-color:var(--ico-blue-soft)"/></linearGradient>
        <linearGradient id="ico-g-blue-solid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-blue-top)"/><stop offset="1" style="stop-color:var(--ico-blue-deep)"/></linearGradient>
        <linearGradient id="ico-g-green-soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-glass-rim)"/><stop offset="0.3" style="stop-color:var(--ico-green-soft-top)"/><stop offset="1" style="stop-color:var(--ico-green-soft)"/></linearGradient>
        <linearGradient id="ico-g-green-solid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-green-top)"/><stop offset="1" style="stop-color:var(--ico-green-deep)"/></linearGradient>
        <linearGradient id="ico-g-red-soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-glass-rim)"/><stop offset="0.3" style="stop-color:var(--ico-red-soft-top)"/><stop offset="1" style="stop-color:var(--ico-red-soft)"/></linearGradient>
        <linearGradient id="ico-g-red-solid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-red-top)"/><stop offset="1" style="stop-color:var(--ico-red-deep)"/></linearGradient>
        <linearGradient id="ico-g-yellow-soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-glass-rim)"/><stop offset="0.3" style="stop-color:var(--ico-yellow-soft-top)"/><stop offset="1" style="stop-color:var(--ico-yellow-soft)"/></linearGradient>
        <linearGradient id="ico-g-yellow-solid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-yellow-top)"/><stop offset="1" style="stop-color:var(--ico-yellow-deep)"/></linearGradient>
        <linearGradient id="ico-g-amber-soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-glass-rim)"/><stop offset="0.3" style="stop-color:var(--ico-amber-soft-top)"/><stop offset="1" style="stop-color:var(--ico-amber-soft)"/></linearGradient>
        <linearGradient id="ico-g-amber-solid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-amber-top)"/><stop offset="1" style="stop-color:var(--ico-amber-deep)"/></linearGradient>
        <linearGradient id="ico-g-purple-soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-glass-rim)"/><stop offset="0.3" style="stop-color:var(--ico-purple-soft-top)"/><stop offset="1" style="stop-color:var(--ico-purple-soft)"/></linearGradient>
        <linearGradient id="ico-g-purple-solid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ico-purple-top)"/><stop offset="1" style="stop-color:var(--ico-purple-deep)"/></linearGradient>
      </defs>
    </svg>
    <div id="app" class="app">
      <div class="boot-splash" id="boot-splash" aria-hidden="true">
        <div class="boot-mark">
          <img src="/logo.svg" width="64" height="64" alt="writedoc" />
        </div>
      </div>
    </div>
  </body>
</html>
